name: build Linux Intel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload build outputs to. Leave empty to skip release upload.
        required: false
        default: latest
        type: string
      overwrite_release_assets:
        description: Replace existing release assets with the same filenames.
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  linux-intel:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm install

      - name: Check host boundaries
        run: npm run check:host-boundaries

      - name: Build TypeScript output
        run: npm run build

      - name: Build Electron app (Linux intel)
        run: node scripts/build-linux.js --x64

      - name: Confirm target release exists
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: Latest build
          TARGET_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$TARGET_REPO" --prerelease --latest=false --title "$RELEASE_NAME"
          else
            gh release create "$RELEASE_TAG" --repo "$TARGET_REPO" --prerelease --latest=false --title "$RELEASE_NAME" --notes ""
          fi

      - name: Upload Linux assets to GitHub release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_REPO: ${{ github.repository }}
          OVERWRITE_RELEASE_ASSETS: ${{ inputs.overwrite_release_assets }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          appimage=build/output/DialogCreator_intel.AppImage
          metadata=build/output/latest-linux.yml
          test -f "$appimage"
          test -f "$metadata"
          files=("$appimage" "$metadata")
          if [ -f "$appimage.blockmap" ]; then
            files+=("$appimage.blockmap")
          fi

          if [ "$OVERWRITE_RELEASE_ASSETS" = "true" ]; then
            release_assets=()
            while IFS= read -r asset; do
              release_assets+=("$asset")
            done < <(gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" --json assets --jq '.assets[].name')
            for asset in "${release_assets[@]}"; do
              case "$asset" in
                DialogCreator_intel.AppImage|DialogCreator_intel.AppImage.blockmap|\
                DialogCreator_*_x86_64.AppImage|DialogCreator_*_x86_64.AppImage.blockmap|\
                DialogCreator_*_x64.AppImage|DialogCreator_*_x64.AppImage.blockmap|latest-linux.yml)
                  gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$TARGET_REPO" --yes
                  ;;
              esac
            done
          fi
          cmd=(gh release upload "$RELEASE_TAG" --repo "$TARGET_REPO")
          if [ "$OVERWRITE_RELEASE_ASSETS" = "true" ]; then
            cmd+=(--clobber)
          fi
          cmd+=("${files[@]}")
          "${cmd[@]}"
