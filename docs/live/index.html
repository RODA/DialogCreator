<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <title>Dialog creator</title>
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self';">
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="shell-web/pages/browser.css">
    </head>

    <body>
        <div class="dialogcreator-web-app">
            <nav id="dialogcreator-browser-menu" class="web-menubar" aria-label="Application menu">
                <div class="web-menu-root" data-menu-root>
                    <button type="button" class="web-menu-button" aria-haspopup="menu" aria-expanded="false">File</button>
                    <div class="web-menu-popup" role="menu">
                        <button type="button" class="web-menu-item" role="menuitem" id="dialogcreator-browser-new">
                            <span>New</span>
                            <span class="web-menu-shortcut">Ctrl+N</span>
                        </button>
                        <button type="button" class="web-menu-item" role="menuitem" id="dialogcreator-browser-load">
                            <span>Load</span>
                            <span class="web-menu-shortcut">Ctrl+L</span>
                        </button>
                        <div class="web-menu-separator" role="separator"></div>
                        <button type="button" class="web-menu-item" role="menuitem" id="dialogcreator-browser-save">
                            <span>Save</span>
                            <span class="web-menu-shortcut">Ctrl+S</span>
                        </button>
                        <button type="button" class="web-menu-item" role="menuitem" id="dialogcreator-browser-save-as">
                            <span>Save as ...</span>
                            <span class="web-menu-shortcut">Ctrl+Shift+S</span>
                        </button>
                        <div class="web-menu-separator" role="separator"></div>
                        <button type="button" class="web-menu-item" role="menuitem" id="dialogcreator-browser-preview">
                            <span>Preview</span>
                            <span class="web-menu-shortcut">Ctrl+P</span>
                        </button>
                    </div>
                </div>

                <div class="web-menu-root" data-menu-root>
                    <button type="button" class="web-menu-button" aria-haspopup="menu" aria-expanded="false">Edit</button>
                    <div class="web-menu-popup" role="menu">
                        <button type="button" class="web-menu-item" role="menuitem" data-browser-edit-command="undo">Undo</button>
                        <button type="button" class="web-menu-item" role="menuitem" data-browser-edit-command="redo">Redo</button>
                        <div class="web-menu-separator" role="separator"></div>
                        <button type="button" class="web-menu-item" role="menuitem" data-browser-edit-command="cut">Cut</button>
                        <button type="button" class="web-menu-item" role="menuitem" data-browser-edit-command="copy">Copy</button>
                        <button type="button" class="web-menu-item" role="menuitem" data-browser-edit-command="paste">Paste</button>
                        <button type="button" class="web-menu-item" role="menuitem" data-browser-edit-command="selectAll">Select All</button>
                    </div>
                </div>

                <div class="web-menu-root" data-menu-root>
                    <button type="button" class="web-menu-button" aria-haspopup="menu" aria-expanded="false">Info</button>
                    <div class="web-menu-popup" role="menu">
                        <button type="button" class="web-menu-item" role="menuitem" data-browser-info-command="manual">User manual</button>
                        <button type="button" class="web-menu-item" role="menuitem" data-browser-info-command="api">API reference</button>
                        <button type="button" class="web-menu-item" role="menuitem" data-browser-info-command="about">About</button>
                    </div>
                </div>

                <span id="dialogcreator-browser-status" class="web-menubar-status" aria-live="polite"></span>
                <input type="file" id="dialogcreator-browser-file-input" accept=".dc.zip" hidden>
            </nav>

            <main id="dialogcreator-browser-desktop" class="web-desktop">
                <section
                    id="dialogcreator-main-window"
                    class="web-workbench-window"
                    role="dialog"
                    aria-label="Dialog creator">
                    <div id="dialogcreator-main-titlebar" class="web-workbench-window__titlebar">
                        <div class="web-workbench-window__title">Dialog creator</div>
                    </div>
                    <iframe
                        id="dialogcreator-browser-frame"
                        class="web-workbench-window__frame"
                        title="DialogCreator editor"
                        src="pages/editor.html"></iframe>
                    <span class="web-workbench-resize-handle" data-resize-direction="right" aria-hidden="true"></span>
                    <span class="web-workbench-resize-handle" data-resize-direction="bottom" aria-hidden="true"></span>
                    <span class="web-workbench-resize-handle" data-resize-direction="corner" aria-hidden="true"></span>
                </section>
            </main>
        </div>

        <script src="shell-web/pages/browserComposition.js"></script>
    </body>

</html>
